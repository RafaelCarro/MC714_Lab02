services:
  node1:
    build: .
    environment:
      NODE_ID: "1"
      NODE_PORT: "50051"
      COORDINATOR_ID: "3"
      NODE_ENDPOINTS: "1=node1:50051,2=node2:50051,3=node3:50051"
      RPC_TIMEOUT_SECONDS: "${RPC_TIMEOUT_SECONDS:-2}"
      HEARTBEAT_INTERVAL_SECONDS: "${HEARTBEAT_INTERVAL_SECONDS:-3}"
      HEARTBEAT_FAILURE_THRESHOLD: "${HEARTBEAT_FAILURE_THRESHOLD:-2}"
    ports:
      - "50051:50051"

  node2:
    build: .
    environment:
      NODE_ID: "2"
      NODE_PORT: "50051"
      COORDINATOR_ID: "3"
      NODE_ENDPOINTS: "1=node1:50051,2=node2:50051,3=node3:50051"
      RPC_TIMEOUT_SECONDS: "${RPC_TIMEOUT_SECONDS:-2}"
      HEARTBEAT_INTERVAL_SECONDS: "${HEARTBEAT_INTERVAL_SECONDS:-3}"
      HEARTBEAT_FAILURE_THRESHOLD: "${HEARTBEAT_FAILURE_THRESHOLD:-2}"
    ports:
      - "50052:50051"

  node3:
    build: .
    environment:
      NODE_ID: "3"
      NODE_PORT: "50051"
      COORDINATOR_ID: "3"
      NODE_ENDPOINTS: "1=node1:50051,2=node2:50051,3=node3:50051"
      RPC_TIMEOUT_SECONDS: "${RPC_TIMEOUT_SECONDS:-2}"
      HEARTBEAT_INTERVAL_SECONDS: "${HEARTBEAT_INTERVAL_SECONDS:-3}"
      HEARTBEAT_FAILURE_THRESHOLD: "${HEARTBEAT_FAILURE_THRESHOLD:-2}"
    ports:
      - "50053:50051"